<!doctype html>
<html lang="fr" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ScreenPilot</title>
  <meta name="description" content="Films, séries, anime et manga : ce que tu regardes et ton temps d'écran estimé. Hors-ligne, sans compte.">
  <meta name="theme-color" content="#07080c">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ScreenPilot">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    // Thème appliqué avant le rendu (pas de flash) : réglage copié par l'app.
    try {
      var t = localStorage.getItem('screenpilot:theme') || 'sombre';
      var sombre = t === 'sombre' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', sombre);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>ScreenPilot nécessite JavaScript.</noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
