<!doctype html>
<html lang="fr" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FitMaison</title>
  <meta name="description" content="Perte de poids : séances au poids du corps à la maison ou au jardin, exercices expliqués, suivi du poids, nutrition.">
  <meta name="theme-color" content="#0f1115">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FitMaison">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    try {
      var t = localStorage.getItem('fitmaison:theme') || 'sombre';
      var sombre = t === 'sombre' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', sombre);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>FitMaison nécessite JavaScript.</noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
