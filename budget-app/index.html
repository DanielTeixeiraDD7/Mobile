<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Budget</title>
  <meta name="description" content="Suivi de dépenses et budget à deux, hors-ligne.">
  <meta name="theme-color" content="#f4f6f3">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    // Thème sombre appliqué avant le rendu (pas de flash) : réglage local copié par l'app.
    try {
      var t = localStorage.getItem('budget2:theme') || 'auto';
      if (t === 'sombre' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>Budget nécessite JavaScript.</noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
